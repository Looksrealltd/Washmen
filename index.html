.phone-dots span:last-child{background:#57c653}

const imageStore={};
let currentEp=0;
let filteredEps=EPISODES.map((_,i)=>i);

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML='';
  filteredEps.forEach(idx=>{
    const ep=EPISODES[idx];
    const wm=WEEKS[ep.w];
    const isActive=idx===currentEp;
    const hasImg=!!imageStore[idx];
    const div=document.createElement('div');
    div.className='sidebar-ep'+(isActive?' active':'');
    div.dataset.idx=idx;
    div.innerHTML=`<div class="ep-num-pill">Ep ${ep.n}</div><div class="ep-sidebar-info"><div class="ep-sidebar-title">"${ep.title}"</div><div class="ep-sidebar-week">${wm.label.split('—')[0].trim()}</div></div><div class="ep-img-dot ${hasImg?'has-img':''}"></div>`;
    div.onclick=()=>goToEp(idx);
    sb.appendChild(div);
  });
}

function buildSlide(idx){
  const ep=EPISODES[idx];
  const wm=WEEKS[ep.w];
  const hasImg=!!imageStore[idx];
  const imgData=imageStore[idx]||{};
  let chatHtml='';
  ep.messages.forEach(m=>{
    if(m.reactions){chatHtml+=`<div class="reactions">${m.reactions.map(r=>`<span class="reaction-chip">${r}</span>`).join('')}</div>`;}
    else{chatHtml+=`<div class="chat-name ${m.side==='out'?'r':''}">${m.who}</div><div class="bubble-row ${m.side==='out'?'r':''}"><div class="bubble ${m.side}">${m.text}<span class="ts">${m.ts}</span></div></div>`;}
  });
  const pos=filteredEps.indexOf(idx);
  const total=filteredEps.length;
  const prevIdx=pos>0?filteredEps[pos-1]:null;
  const nextIdx=pos<total-1?filteredEps[pos+1]:null;
  return `
<div class="slide-header">
  <div class="slide-ep-label"><span>Episode ${ep.n} of 30</span><span class="week-badge ${wm.cls}">${wm.label}</span></div>
  <div class="slide-title">"${ep.title}"</div>
  <div class="slide-premise">${ep.premise}</div>
</div>
<div class="red-thread-card"><span style="font-size:14px;flex-shrink:0;margin-top:1px">🔴</span><div class="thread-text"><strong>Red thread:</strong> ${ep.thread}</div></div>
<div class="slide-grid">
  <div class="phone-wrap"><div class="phone-topbar"><div class="phone-dots"><span></span><span></span><span></span></div><div class="phone-label-bar">Group chat · The Chronicles</div></div><div class="phone-body">${chatHtml}</div></div>
  <div style="display:flex;flex-direction:column;gap:1rem;">
    <div class="img-section ${hasImg?'has-img':''}" id="img-section-${idx}">
      <input type="file" accept="image/*" class="img-file-input" id="file-input-${idx}" onchange="handleImageUpload(${idx},this)">
      <div class="img-placeholder" id="img-placeholder-${idx}" style="${hasImg?'display:none':''}" onclick="document.getElementById('file-input-${idx}').click()">
        <div class="img-placeholder-icon">↑</div>
        <div class="img-placeholder-title">Upload visual for this episode</div>
        <div class="img-placeholder-sub">Photo, mockup, or AI-generated image<br>PNG, JPG, WEBP</div>
        <div class="img-placeholder-btn">Choose Image</div>
      </div>
      <div class="img-preview-wrap ${hasImg?'visible':''}" id="img-preview-wrap-${idx}">
        <img class="img-preview" id="img-preview-${idx}" src="${imgData.dataUrl||''}" alt="Episode visual">
        <div class="img-toolbar">
          <span class="img-filename" id="img-filename-${idx}">${imgData.filename||''}</span>
          <button class="img-action-btn btn-download" onclick="downloadImage(${idx})">↓ Download</button>
          <button class="img-action-btn btn-change" onclick="document.getElementById('file-input-${idx}').click()">Change</button>
          <button class="img-action-btn btn-remove" onclick="removeImage(${idx})">Remove</button>
        </div>
      </div>
    </div>
    <div class="card"><div class="card-label">Opening hook</div><div class="card-content">${ep.hook}</div></div>
  </div>
</div>
<div class="slide-grid">
  <div class="card"><div class="card-label">Caption</div><div class="card-content"><em>${ep.caption}</em></div></div>
  <div class="card"><div class="card-label">Format</div><div class="card-content">${ep.format}</div></div>
</div>
<div class="card" style="margin-bottom:1.25rem"><div class="card-label">Hashtags</div><div class="tags-row">${ep.hashtags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>
<div class="slide-nav-bar">
  <div class="slide-nav-info">Episode ${ep.n} · ${wm.label}</div>
  <div class="slide-nav-btns">
    ${prevIdx!==null?`<button class="slide-nav-btn" onclick="goToEp(${prevIdx})">← Prev</button>`:''}
    ${nextIdx!==null?`<button class="slide-nav-btn primary" onclick="goToEp(${nextIdx})">Next →</button>`:`<button class="slide-nav-btn primary" style="opacity:.35;cursor:default">End of Series</button>`}
  </div>
</div>`;
}

function goToEp(idx){
  currentEp=idx;
  renderSlides();
  updateHeader();
  document.getElementById('slide-area').scrollTo({top:0,behavior:'smooth'});
}

function renderSlides(){
  const area=document.getElementById('slide-area');
  area.innerHTML='';
  const div=document.createElement('div');
  div.className='slide active';
  div.innerHTML=buildSlide(currentEp);
  area.appendChild(div);
  buildSidebar();
}

function updateHeader(){
  document.getElementById('cur-ep-display').textContent=EPISODES[currentEp].n;
  const pos=filteredEps.indexOf(currentEp);
  document.getElementById('progress-fill').style.width=((pos+1)/filteredEps.length*100)+'%';
  document.getElementById('prev-btn').disabled=pos<=0;
  document.getElementById('next-btn').disabled=pos>=filteredEps.length-1;
}

function navigate(dir){
  const pos=filteredEps.indexOf(currentEp);
  const np=pos+dir;
  if(np>=0&&np<filteredEps.length)goToEp(filteredEps[np]);
}

function filterWeek(w,btn){
  document.querySelectorAll('.week-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  filteredEps=w==='all'?EPISODES.map((_,i)=>i):EPISODES.map((_,i)=>i).filter(i=>EPISODES[i].w===w);
  if(!filteredEps.includes(currentEp))currentEp=filteredEps[0];
  renderSlides();
  updateHeader();
}

function handleImageUpload(idx,input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    imageStore[idx]={dataUrl:e.target.result,filename:file.name,origFile:file};
    renderSlides();
    updateHeader();
    updateExportDot();
  };
  reader.readAsDataURL(file);
}

function removeImage(idx){
  delete imageStore[idx];
  renderSlides();
  updateHeader();
  updateExportDot();
}

function downloadImage(idx){
  const data=imageStore[idx];
  if(!data)return;
  const ep=EPISODES[idx];
  const a=document.createElement('a');
  a.href=data.dataUrl;
  a.download=`washmen-ep${ep.n}-${ep.title.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')}.${data.filename.split('.').pop()||'jpg'}`;
  a.click();
}

function updateExportDot(){
  const count=Object.keys(imageStore).length;
  document.getElementById('export-dot').style.background=count>0?'#3baa78':'rgba(245,242,236,.25)';
  document.getElementById('export-label').textContent=count>0?`Export Calendar (${count} image${count>1?'s':''})`:'Export Calendar';
}

function exportCalendar(){
  const rows=EPISODES.map(ep=>{
    const wm=WEEKS[ep.w];
    const idx=EPISODES.indexOf(ep);
    const hasImg=!!imageStore[idx];
    return [
      `Ep ${ep.n}`,`"${ep.title}"`,wm.label,ep.format,ep.premise,ep.hook,ep.caption,ep.hashtags.join(' '),ep.thread,hasImg?'Image uploaded':'No image yet'
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  const csv=['Episode,Title,Week,Format,Premise,Hook,Caption,Hashtags,Red Thread,Image Status',...rows].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='washmen-laundry-chronicles-content-calendar.csv';
  a.click();
  const keys=Object.keys(imageStore);
  keys.forEach((idx,i)=>setTimeout(()=>downloadImage(Number(idx)),400*(i+1)));
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')navigate(1);
  if(e.key==='ArrowLeft')navigate(-1);
});

renderSlides();
updateHeader();
updateExportDot();
</script>
</body>
</html>
